<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>霓虹游戏厅 · NEON ARCADE</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:
      radial-gradient(900px 520px at 50% -8%, #17325f 0%, rgba(10,20,40,0) 62%),
      radial-gradient(760px 420px at 88% 12%, #33124f 0%, rgba(10,20,40,0) 58%),
      radial-gradient(700px 500px at 8% 92%, #0e2a4d 0%, rgba(10,20,40,0) 60%),
      #04060d;
    color:#eaf6ff;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:44px 20px 36px;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(rgba(90,160,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(90,160,255,.045) 1px, transparent 1px);
    background-size:58px 58px;
    mask-image:radial-gradient(circle at 50% 35%, #000 0%, transparent 78%);
    -webkit-mask-image:radial-gradient(circle at 50% 35%, #000 0%, transparent 78%);
  }
  .wrap{width:min(1040px,100%);position:relative;z-index:1}
  .eyebrow{
    margin:0 0 10px;font-size:10.5px;letter-spacing:.48em;text-transform:uppercase;
    color:#5fd8ff;text-shadow:0 0 12px rgba(60,210,255,.6);
  }
  h1{
    margin:0;font-size:clamp(34px,6.2vw,60px);letter-spacing:.1em;font-weight:800;
    color:#fff;text-shadow:0 0 12px rgba(80,225,255,.8),0 0 44px rgba(30,140,255,.5);
  }
  .tagline{margin:10px 0 34px;font-size:13.5px;color:#8fb3cf;letter-spacing:.04em}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:760px){
    .cards{grid-template-columns:1fr;gap:16px}
    body{padding:28px 14px 24px;align-items:flex-start}
    .tagline{margin-bottom:22px}
  }
  .card{
    display:block;width:100%;padding:0;text-align:left;font:inherit;color:inherit;
    border:1px solid rgba(90,170,255,.22);border-radius:20px;overflow:hidden;cursor:pointer;
    background:linear-gradient(180deg,rgba(17,31,60,.92),rgba(7,12,24,.96));
    box-shadow:0 22px 50px -28px rgba(0,0,0,.95);
    transition:transform .18s ease, box-shadow .28s ease, border-color .28s ease;
    animation:rise .5s cubic-bezier(.2,.9,.3,1.15) both;
  }
  .card:nth-child(2){animation-delay:.08s}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .card:hover,.card:focus-visible{
    transform:translateY(-5px);border-color:rgba(110,225,255,.6);outline:none;
    box-shadow:0 0 0 1px rgba(90,220,255,.28),0 30px 64px -26px rgba(30,140,255,.55);
  }
  .shot{display:block;position:relative;aspect-ratio:4/3;overflow:hidden;background:#05070f}
  .shot img{width:100%;height:100%;object-fit:cover;display:block;opacity:.9;transition:transform .6s ease,opacity .3s}
  .card:hover .shot img{transform:scale(1.045);opacity:1}
  .shot::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,8,16,0) 52%,rgba(4,8,16,.92) 100%)}
  .body{display:block;padding:16px 20px 20px;margin-top:-26px;position:relative;z-index:1}
  .name{display:block;font-size:22px;font-weight:800;letter-spacing:.06em}
  .en{display:block;margin-top:2px;font-family:ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:.4em;color:#4f7fa8}
  .desc{display:block;margin:9px 0 12px;font-size:12.5px;line-height:1.72;color:#93b6cf}
  .tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
  .tags i{
    font-style:normal;font-size:10.5px;padding:3px 9px;border-radius:20px;
    border:1px solid rgba(90,180,255,.25);color:#7fb6d8;background:rgba(20,50,90,.35);
  }
  .go{
    display:inline-block;font-weight:800;font-size:12.5px;letter-spacing:.16em;
    color:#02121c;padding:9px 20px;border-radius:10px;
    background:linear-gradient(180deg,#b8fbff 0%,#37d8ff 45%,#0aa6e8 100%);
    box-shadow:0 0 18px rgba(60,215,255,.45),0 4px 0 #0a5f8a;
  }
  .foot{
    margin:30px 0 0;text-align:center;font-size:11.5px;line-height:1.9;
    color:#5f7f9c;letter-spacing:.04em;
  }
  .foot b{color:#9fd9ff;font-weight:600}

  /* ---------- 游戏容器 ---------- */
  #player{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:#04060d}
  #player.hidden{display:none}
  .bar{
    flex:0 0 38px;height:38px;display:flex;align-items:center;gap:14px;padding:0 12px;
    background:#070b14;border-bottom:1px solid rgba(90,170,255,.16);
    font-size:12px;letter-spacing:.06em;
  }
  #back{
    font:inherit;font-size:11.5px;letter-spacing:.1em;color:#9fd9ff;cursor:pointer;
    background:rgba(20,45,80,.5);border:1px solid rgba(90,200,255,.35);
    border-radius:8px;padding:6px 12px;
    transition:background .2s,border-color .2s;
  }
  #back:hover{background:rgba(30,70,120,.6);border-color:rgba(120,225,255,.65)}
  #title{color:#bfe8ff;font-weight:700;letter-spacing:.14em}
  .hint{margin-left:auto;color:#5f7f9c;font-size:11px}
  #frame{flex:1;width:100%;border:0;background:#04060d;display:block}
  .hidden{display:none}
</style>
</head>

  };
  var NAMES = { chase: '打字追缉', racer: '打字赛车' };

  var hub = document.getElementById('hub');
  var player = document.getElementById('player');
  var frame = document.getElementById('frame');
  var title = document.getElementById('title');
  var back = document.getElementById('back');
  var current = null;

  function decode(b64) {
    var bin = atob(b64);
    var i, bytes = new Uint8Array(bin.length);
    for (i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (window.TextDecoder) return new TextDecoder('utf-8').decode(bytes);
    var s = '';
    for (i = 0; i < bytes.length; i++) s += '%' + ('0' + bytes[i].toString(16)).slice(-2);
    return decodeURIComponent(s);
  }

  function openGame(id) {
    if (!GAMES[id] || current === id) return;
    current = id;
    title.textContent = NAMES[id] || '';
    frame.srcdoc = decode(GAMES[id]);
    player.classList.remove('hidden');
    hub.classList.add('hidden');
    document.body.style.overflow = 'hidden';
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
    setTimeout(function () {
      try { frame.focus(); } catch (e) {}
    }, 120);
  }

  function closeGame() {
    current = null;
    player.classList.add('hidden');
    hub.classList.remove('hidden');
    document.body.style.overflow = '';
    frame.srcdoc = '';
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    try { back.blur(); } catch (e) {}
  }

  var cards = document.querySelectorAll('[data-game]');
  for (var i = 0; i < cards.length; i++) {
    (function (card) {
      card.addEventListener('click', function () {
        openGame(card.getAttribute('data-game'));
      });
    })(cards[i]);
  }

  back.addEventListener('click', closeGame);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && current) closeGame();
  });

  frame.addEventListener('load', function () {
    try { frame.contentWindow.focus(); } catch (e) {}
  });

  var h = (location.hash || '').replace('#', '');
  if (h === 'chase' || h === 'racer') openGame(h);
})();
</script>
